  * { box-sizing: border-box; }
  :root { --g-edge: #2E7D32; --o-edge: #F0A030; --o-text: #C97A00; --r-edge: #C62828; --p-edge: #1565C0;
  }
  body {
    margin: 0; background: #fff; color: #000;
    font-family: 'Montserrat', 'Century Gothic', 'Trebuchet MS', sans-serif;
    font-size: 20px;
  }
  .wrap { max-width: 1640px; margin: 0 auto; padding: 14px 20px 30px; }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  h1 { font-size: 26px; margin: 0; white-space: nowrap; }
  .timer-wrap { position: relative; margin-right: auto; }
  .clock { font-size: 22px; font-weight: 700; padding: 0 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #timerBtn { min-width: 112px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #timerBtn.running { background: #000; color: #fff; }
  #timerBtn.warn { background: var(--r-edge); border-color: var(--r-edge); color: #fff; }
  #timerBtn.done { background: var(--r-edge); border-color: var(--r-edge); color: #fff; animation: flash 0.8s steps(2, start) infinite; }
  @keyframes flash { to { visibility: hidden; } }
  .timer-panel { display: none; position: absolute; top: calc(100% + 8px); left: 0; z-index: 20; background: #fff; border: 3px solid #000; border-radius: 8px; padding: 12px; width: 300px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .timer-panel.open { display: block; }
  .tp-label { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
  .tp-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .tp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .timer-panel button { font-size: 15px; padding: 8px 6px; }
  h1 { display: none; }
  @media (max-width: 1500px) and (min-width: 761px) { header .seg span { display: none; } .practise { max-width: 205px; } }
  header button { font-size: 18px; padding: 8px 14px; }
  #fsBtn { font-size: 24px; padding: 4px 12px; line-height: 1; }
  #zoomSeg button { min-width: 44px; padding: 8px 10px; font-variant-numeric: tabular-nums; }
  #zoomSeg #zoomFit { min-width: 64px; font-size: 16px; }
  #zoomSeg #zoomFit.on { background: #000; color: #fff; }
  #gridFit { display: flow-root; }
  body.fitting .wrap { padding-bottom: 8px; }
  @media (max-width: 1500px) and (min-width: 1001px) {
    header { gap: 6px; }
    header button { padding: 8px 10px; }
    #zoomSeg button { min-width: 36px; padding: 8px 8px; }
    #zoomSeg #zoomFit { min-width: 50px; }
    .seg button { min-width: 40px; padding: 8px 8px; }
    #timerBtn { min-width: 96px; }
    .practise { max-width: 180px; }
  }
  @media (max-width: 1330px) and (min-width: 1001px) {
    header { gap: 5px; }
    header button { font-size: 16px; padding: 7px 8px; }
    .practise { max-width: 170px; font-size: 15px; }
    .clock { font-size: 19px; padding: 0 2px; }
    #timerBtn { min-width: 92px; }
    .seg button { min-width: 38px; }
    #fsBtn { font-size: 20px; padding: 4px 8px; }
  }
  button {
    font-family: inherit; font-size: 20px; font-weight: bold; color: #000; background: #fff;
    border: 3px solid #000; border-radius: 6px; padding: 10px 16px; cursor: pointer; touch-action: manipulation;
  }
  button:active { background: #000; color: #fff; }
  button.primary { background: #000; color: #fff; }
  button.primary:active { background: #fff; color: #000; }

  /* topics panel */
  #topics { display: none; border: 3px solid #000; padding: 12px 14px; margin-bottom: 14px; }
  #topics.open { display: block; }
  .topic-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .topic-head b { margin-right: auto; font-size: 22px; }
  .opt-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 2px solid #000; }
  .opt-row b { font-size: 20px; }
  .practise { font-family: inherit; font-size: 16px; font-weight: 700; padding: 8px 6px; border: 3px solid #000; border-radius: 6px; background: #fff; max-width: 228px; }
  .practise.topic-on { background: #000; color: #fff; }
  #ansSeg button { font-size: 17px; padding: 8px 14px; }
  body.ans-only .ans ol { display: none; }
  body.ans-only .ans .final { margin-top: 0; }
  .grid.n12 .dg svg { height: 100px; } .grid.n12 .dg.clock-dg svg { height: 130px; } .grid.n12 .dg.chart-dg svg { height: 200px; }
  .grid.n12 .dg.shape-dg svg, .grid.n12 .dg.angle-dg svg { height: 130px; } .grid.n12 .dg.grid-dg svg { height: 110px; } .grid.n12 .dg.bar-dg svg { height: 56px; } .grid.n12 .dg.nl-dg svg { height: auto; max-width: 380px; }
  .grid.n12 .card { min-height: 0; }
  .dg.gridref-dg svg, .dg.coord-dg svg, .dg.map-dg svg { height: 210px; } .dg.poly-dg svg, .dg.solid-dg svg { height: 140px; }
  .grid.n12 .dg.gridref-dg svg, .grid.n12 .dg.coord-dg svg, .grid.n12 .dg.map-dg svg { height: 190px; } .grid.n12 .dg.poly-dg svg, .grid.n12 .dg.solid-dg svg { height: 110px; }
  .grid.n3 .dg.gridref-dg svg, .grid.n3 .dg.coord-dg svg, .grid.n3 .dg.map-dg svg { height: 260px; } .grid.n1 .dg.gridref-dg svg, .grid.n1 .dg.coord-dg svg, .grid.n1 .dg.map-dg svg { height: 440px; }
  .ans .final .dg svg { height: 150px; }
  .dg.sym-dg svg { height: 170px; } .grid.n12 .dg.coord-dg svg, .grid.n12 .dg.map-dg svg { height: 240px; } .grid.n12 .dg.sym-dg svg { height: 160px; }
  .grid.n3 .dg.sym-dg svg { height: 230px; } .grid.n1 .dg.sym-dg svg { height: 380px; }

  .chk { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .chk input { width: 20px; height: 20px; }
  .hint { font-size: 14px; color: #444; }
  #printArea { display: none; }
  @media print {
    @page { size: A4; margin: 0; }
    body > .wrap, .timer-panel, #race, #picker, #pickerTab { display: none !important; }
    #printArea { display: block; }
    * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  }
  .page { width: 210mm; height: 297mm; padding: 9mm 11mm 8mm; box-sizing: border-box; display: flex; flex-direction: column; page-break-after: always; break-after: page;
    font-family: 'Century Gothic', 'CenturyGothic', AppleGothic, 'Gill Sans', 'Trebuchet MS', sans-serif; color: #000; background: #fff; }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .p-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5mm; }
  .p-title { font-size: 15pt; font-weight: 700; }
  .p-sub { font-size: 9.5pt; }
  .p-name { display: flex; border: 1.5px solid #000; margin-bottom: 3mm; font-size: 11pt; }
  .p-name div { padding: 2mm 3mm; } .p-name div:first-child { flex: 3; border-right: 1.5px solid #000; } .p-name div:last-child { flex: 1.3; }
  .p-sec { background: #D9D9D9; font-weight: 700; font-size: 10.5pt; padding: 1.3mm 3mm; border: 1.5px solid #000; border-bottom: 0; }
  .p-list { flex: 1; display: flex; flex-direction: column; min-height: 0; }

<div class="wrap">
  <header>
    <h1>Bookwork Maths</h1>

  else if (L === 2) { a = R(120, 899); b = R(120, 899); }

    s: [`Estimate. ${N(ra)} + ${N(rb)} = ${N(ra + rb)}`, 'Line up the place values. Add the ones first, then the tens, hundreds and thousands. Regroup when a column makes 10 or more.'] };

sub(L) {
  let a, b;
  if (L === 1) { do { a = R(41, 99); b = R(12, a - 10); } while (b % 10 <= a % 10); }
  else if (L === 2) { a = R(300, 999); b = R(101, a - 50); }

mult(L) {
  if (L === 1 && Math.random() < .4) {
    const r = R(2, 5), c = R(3, 8);

},

div(L) {
  if (L === 1) { const d = pick([2, 3, 4, 5, 10]), q = R(2, 10); return { q: `${d * q} ÷ ${d}`, a: N(q), s: [`Think of the multiplication fact. ? × ${d} = ${d * q}`, `${q} × ${d} = ${d * q}, so ${d * q} ÷ ${d} = ${q}`] }; }
  if (L === 2) {
    const d = R(3, 9), q = R(3, 10);

},

pv(L) {

},

nline(L) {

frac(L) {
  if (L < 3 && Math.random() < .4) {
    if (L === 1) { const d = pick([2, 3, 4, 5, 6, 8, 10]), n = R(1, d - 1);
      return { q: `What fraction of the shape is shaded?${fracShapeSVG(n, d)}`, a: F(n, d), s: [`The shape has ${d} equal parts.`, `${n} ${n === 1 ? 'part is' : 'parts are'} shaded, so ${F(n, d)} is shaded.`] }; }
    const t = pick([6, 8, 9, 10, 12]), k = R(1, t - 1);

      return { q: `Complete. ${F(n, d)} = ${F('?', d * k)}`, a: N(n * k), s: [`The denominator is multiplied by ${k}. ${d} × ${k} = ${d * k}`, `Multiply the numerator by ${k} too. ${n} × ${k} = ${n * k}`] }; }

    return { q: `Which fraction is larger, ${F(a, d)} or ${F(b, d)}?`, a: F(Math.max(a, b), d), s: ['The denominators are the same, so the parts are the same size.', `The fraction with more parts is larger. ${Math.max(a, b)} is more than ${Math.min(a, b)}.`] };
  }

    const d = pick([4, 5, 6, 8, 10]), a = R(1, d - 2), b = R(1, d - a);

},

decs(L) {
  if (L === 1) { const t = R(1, 9); return Math.random() < .5
    ? { q: `Write ${t} tenths as a decimal.`, a: `0.${t}`, s: ['Tenths are the first place after the decimal point.', `${t} tenths = 0.${t}`] }
    : { q: `Write ${F(t, 10)} as a decimal.`, a: `0.${t}`, s: [`${F(t, 10)} means ${t} tenths.`, `${t} tenths = 0.${t}`] }; }
  if (L === 2) {
    const r = Math.random();
    if (r < .35) { const h = R(11, 99); return { q: `Write ${h} hundredths as a decimal.`, a: dec(h, 2, true), s: ['Hundredths are the second place after the decimal point.', `${h} hundredths = ${dec(h, 2, true)}`] }; }
    if (r < .7) { const o = R(1, 9), t = R(1, 9); return { q: `Write ${o} ones and ${t} tenths as a decimal.`, a: `${o}.${t}`, s: [`Ones go before the decimal point and tenths go after it. ${o}.${t}`] }; }
    let a = R(1, 9) * 10, b; do { b = R(11, 99); } while (b % 10 === 0 || Math.abs(a - b) < 3);
    return { q: `Which is larger, ${dec(a, 2)} or ${dec(b, 2)}?`, a: a > b ? dec(a, 2) : dec(b, 2), s: [`Write both with 2 decimal places. ${dec(a, 2, true)} and ${dec(b, 2, true)}`, `Compare the tenths first, then the hundredths.`] };
  }

  if (Math.random() < .5) return { q: `${dec(x, 1)} + ${dec(y, 1)}`, a: dec(x + y, 1), s: ['Line up the decimal points.', 'Add the tenths first. Regroup 10 tenths as 1 one.'] };
  if (x < y) [x, y] = [y, x]; if (x === y) x += 10;
  return { q: `${dec(x, 1)} − ${dec(y, 1)}`, a: dec(x - y, 1), s: ['Line up the decimal points.', 'Subtract the tenths first. Trade 1 one for 10 tenths if you need to.'] };
},

money(L) {

round(L) {

patterns(L) {
  let terms, rule, next;
  if (L === 1) { const st = pick([2, 3, 4, 5, 10]), a = R(1, 10); terms = [0, 1, 2, 3].map(i => a + i * st); rule = `add ${st}`; next = [a + 4 * st, a + 5 * st]; }
  else if (L === 2) {
    if (Math.random() < .5) { const st = R(6, 9), a = R(1, 12); terms = [0, 1, 2, 3].map(i => a + i * st); rule = `add ${st}`; next = [a + 4 * st, a + 5 * st]; }
    else { const st = pick([3, 4, 5, 6, 10]), a = st * 5 + R(1, 40); terms = [0, 1, 2, 3].map(i => a - i * st); rule = `subtract ${st}`; next = [a - 4 * st, a - 5 * st]; }

},

func(L) {

    const m = pick([2, 3, 4, 5, 10]); return { q: `Input ${x} → ${box('× ' + m)} → Output ?`, a: N(x * m), s: [`${x} × ${m} = ${x * m}`] };

area(L) {

perim(L) {
  if (L < 3 && Math.random() < .45) {

  if (r < .65) { const [shape, n] = pick([['regular pentagon', 5], ['regular hexagon', 6], ['regular octagon', 8]]), s_ = R(3, 12); return { q: `A ${shape} has sides of ${s_} cm. What is its perimeter?`, a: `${n * s_} cm`, s: [`A ${shape} has ${n} equal sides.`, `${s_} × ${n} = ${n * s_} cm`] }; }

angles(L) {

coords(L) {
  if (L === 1) { const x = R(1, 7), y = R(1, 7);

shapes3(L) {

maps(L) {

const APK_COUNT = 4;

function apkMake(entry) {
  if (entry.startsWith('gen:')) {
    const [, st, topic, lv] = entry.split(':'), set = STAGES[+st];
    return Object.assign(set.GEN[topic](+lv), { name: set.TOPICS.find(t => t.id === topic).name });
  }
  const [head, arg] = entry.split(':'), [skill, at] = head.split('@');
  return APK_SKILLS[skill](at ? +at : stage, arg);
}
function apkProblem(entry, topicId, avoid) {
  let p, tries = 0;
  do { p = apkMake(entry); tries++; } while (avoid.has(p.q) && tries < 20);
  return Object.assign(p, { level: 1, topicId, apk: true, topicName: p.name, regen: () => apkProblem(entry, topicId, new Set(problems.map(x => x.q))) });
}
function apkList(topicId) {
  const m = APK_MAP[topicId];
  if (!m) return ['addFacts', 'subFacts', 'timesFacts', 'divFacts'];
  return m[stage] || m[Object.keys(m)[0]];
}
function generateAPK() {
  const skills = apkList(practise);
  const order = shuffle(skills), used = new Set();
  problems = Array.from({ length: APK_COUNT }, (_, i) => { const p = apkProblem(order[i % order.length], practise, used); used.add(p.q); return p; });
}

/* =================== think-pair-share mode =================== */
// One orange or red question. The teacher taps through Think, Pair, Share and Answer.
const TPS_STEPS = ['Think', 'Pair', 'Share', 'Answer'];
const TPS_STEMS = ['We got ___ because ___.', 'First we ___, then we ___.', 'I agree / disagree with my partner because ___.'];
function tpsPanel() {
  const el = document.createElement('div'); el.className = 'tps-head';
  const steps = TPS_STEPS.map((t, i) => `<span class="${i === tpsPhase ? 'on' : i < tpsPhase ? 'done' : ''}">${i + 1}. ${t}</span>`).join('');
  let say = '', extra = '', btns = '';
  if (tpsPhase === 0) { say = 'Think on your own. Solve it on your whiteboard. No talking yet.'; btns = '<button class="primary" data-t="next">Pair ▸</button>'; }
  else if (tpsPhase === 1) { say = 'Pair. Work it out together with your partner.'; extra = '<ul class="tps-stems">' + TPS_STEMS.map(t => `<li>${t}</li>`).join('') + '</ul>'; btns = '<button class="primary" data-t="next">Share ▸</button>'; }
  else if (tpsPhase === 2) { say = (tpsName ? `<span class="tps-name">${tpsName.replace(/</g, '&lt;')}</span>, ` : 'Picking… ') + 'what did you get? How did you get there?'; btns = '<button data-t="again">Pick another</button><button class="primary" data-t="next">Show answer ▸</button>'; }
  else { say = 'Did your pair get the same? If not, where did your thinking change?'; btns = '<button class="primary" data-t="new">Next question ▸</button>'; }
  el.innerHTML = `<div class="tps-steps">${steps}</div><div class="tps-say">${say}</div>${extra}<div class="tps-btns">${btns}</div>`;
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    if (t === 'new') { generate(); return; }
    if (t === 'next') tpsPhase++;
    if (tpsPhase === 2 && (t === 'next' || t === 'again')) { tpsName = ''; render(); tpsPickSharer(); return; }
    render();
  });
  return el;
}
function tpsPickSharer() {
  pk.open = true; pkSave(); pkRender(); queueZoom();
  pkPick(name => { tpsName = name; if (tpsMode && tpsPhase === 2) render(); });
}

/* =================== problem set =================== */
const grid = document.getElementById('grid');
let problems = [];

function makeProblem(level, topicId, avoid) {
  let p, tries = 0;
  do { p = GEN[topicId](level); tries++; } while (avoid.has(p.q) && tries < 20);
  return Object.assign(p, { level, topicId });
}
function generate() {
  if (apkMode) {
    if (practise === 'review' || !GEN[practise]) problems = []; else generateAPK();
    render(); return;
  }
  if (!selected.size) { selected = new Set(TOPICS.map(t => t.id)); renderChips(); }
  if (tpsMode) {
    const topic = practise !== 'review' && GEN[practise] ? practise : pick([...selected]);
    problems = [makeProblem(tpsLevel, topic, new Set())];
    tpsPhase = 0; tpsName = '';
    render(); return;
  }
  const pool = [...selected];
  let bag = [];
  const used = new Set();
  const plan = planFor();
  if (practise !== 'review' && GEN[practise]) {
    problems = plan.map(level => { const p = makeProblem(level, practise, used); used.add(p.q); return p; });
    render(); return;
  }
  problems = plan.map((level, i) => {
    if (!bag.length) bag = shuffle(pool);
    // avoid the same topic twice in a row where possible
    let idx = 0;
    if (i > 0 && bag.length > 1 && bag[0] === problems[i - 1]?.topicId) idx = 1;
    const topicId = bag.splice(idx, 1)[0];
    const p = makeProblem(level, topicId, used); used.add(p.q); return p;
  });
  render();
}
function render() {
  grid.innerHTML = '';
  grid.className = 'grid' + (apkMode ? ' napk' : tpsMode ? ' n1 ntps' : count === 1 ? ' n1' : count === 3 ? ' n3' : ' n12');
  if (tpsMode) grid.appendChild(tpsPanel());
  if (apkMode) {
    const head = document.createElement('div'); head.className = 'apk-head';
    head.innerHTML = practise === 'review' || !GEN[practise]
      ? '<b>Activate prior knowledge</b><span>Choose a topic in the “What are we practising?” list. APK questions are about the skills that topic needs.</span>'
      : `<b>Activate prior knowledge</b><span>Skills you need for ${TOPICS.find(t => t.id === practise).name}</span>`;
    grid.appendChild(head);

function printHTML() {
  const codesOn = document.getElementById('optCodes').checked, keyOn = document.getElementById('optKey').checked;
  const stageName = 'Stage ' + stage, focusName = practise !== 'review' && GEN[practise] ? ` · ${TOPICS.find(t => t.id === practise).name}` : ' · Daily review';
  const LEVEL_NAME = [null, 'Green ★', 'Orange ★★', 'Red ★★★'];
  const block = (p, i) => { const dgs = (p.q.match(/<div class="dg[\s\S]*?<\/svg><\/div>/g) || []).join(''), txt = p.q.replace(/<div class="dg[\s\S]*?<\/svg><\/div>/g, ''); return `<div class="pq"><div class="pq-main"><b>${i + 1}.</b> ${emph(txt)}</div>${dgs ? `<div class="pq-dg">${dgs}</div>` : ''}<div class="pq-score"><div class="tc"><span>✓</span><span>✗</span></div>${codesOn ? '<div class="codes"><span>R</span><span>T</span><span>P</span><span>E</span></div>' : ''}</div></div>`; };
  const pagesIdx = problems.length > 6 ? [[0, 6], [6, problems.length]] : [[0, problems.length]];
  const total = problems.length;
  let html = '';
  pagesIdx.forEach(([a, b], pi) => {
    let list = '', lastLevel = null;
    for (let i = a; i < b; i++) { const p = problems[i];
      const secName = p.apk ? 'Prior knowledge' : LEVEL_NAME[p.level];

      list += block(p, i); }
    const isLast = pi === pagesIdx.length - 1;
    html += `<section class="page">
      ${pi === 0 ? `<div class="p-head"><div class="p-title">Bookwork Maths</div><div class="p-sub">${stageName}${focusName}</div></div><div class="p-name"><div>Name:</div><div>Date:</div></div>` : ''}
      <div class="p-list">${list}</div>
      <div class="p-foot"><span>${codesOn ? 'Error codes. R Reading · T Transforming · P Process skills · E Encoding. Highlight one letter for each incorrect answer.' : ''}</span>${isLast ? `<span class="p-total">Total score &nbsp; ____ / ${total}</span>` : `<span>Page ${pi + 1}</span>`}</div>
    </section>`;
  });

    html += `<section class="page"><div class="p-head"><div class="p-title">Answer key</div><div class="p-sub">${stageName}${focusName}</div></div>

}

const raceEl = document.getElementById('race'), raceArc = document.getElementById('raceArc'), RING = 2 * Math.PI * 60;
let race = null;
function raceShow() {
  const p = problems[race.i], lv = p.apk ? { cls: 'p', stars: 'APK' } : LEVELS[p.level], topic = p.topicName || TOPICS.find(t => t.id === p.topicId).name;

  box.classList.remove('show');

function raceDraw(left, total) {
  const ring = raceArc.parentNode.parentNode;
  raceArc.setAttribute('stroke-dashoffset', (RING * (1 - left / total)).toFixed(1));
  document.getElementById('raceNum').textContent = race.phase === 'q' ? (left >= 60 ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : left) : left;
  document.getElementById('raceLab').textContent = race.paused ? 'Paused' : race.phase === 'q' ? 'Time left' : 'Next in';
  ring.classList.toggle('warn', race.phase === 'q' && left <= 10);
  ring.classList.toggle('answer', race.phase === 'a');
}
function raceTick() {
  if (!race || race.paused) return;

  raceDraw(left, total);
  if (left > 0) return;
  if (race.phase === 'q') { race.phase = 'a'; beep(); document.getElementById('raceAnsBox').classList.add('show'); race.end = Date.now() + race.aSecs * 1000; raceDraw(race.aSecs, race.aSecs); }
  else raceAdvance();

function raceAdvance() {

  document.getElementById('topics').classList.remove('open');

}
function racePause() {

  else { race.end = Date.now() + race.left; race.paused = false; }

document.getElementById('raceBtn').onclick = raceStart;

// The grid sits inside a wrapper so the wrapper's height always shows the zoomed size.
const gridFit = document.createElement('div');
gridFit.id = 'gridFit';
grid.before(gridFit); gridFit.appendChild(grid);
const ZOOM_MIN = 0.4, ZOOM_MAX = 2, FIT_MIN = 0.5, FIT_MAX = 1.5;
let zoomMode = 'fit', zoomManual = 1, zoomNow = 1;
try {
  const z = localStorage.getItem('bookworkZoom');
  if (z && z !== 'fit' && +z >= ZOOM_MIN && +z <= ZOOM_MAX) { zoomMode = 'manual'; zoomManual = +z; }
} catch (e) {}
function setZoom(z) { zoomNow = z; grid.style.zoom = z; }
function fitHeight() {
  const top = gridFit.getBoundingClientRect().top + window.scrollY;
  return window.innerHeight - top - 10;
}
function applyZoom() {
  const fitting = zoomMode === 'fit' && window.innerWidth > 1000;
  document.body.classList.toggle('fitting', fitting);
  if (zoomMode === 'manual') setZoom(zoomManual);
  else if (window.innerWidth <= 1000) setZoom(1);   // single column: scroll instead of shrinking
  else {
    // find the biggest size where every question fits on screen
    const avail = fitHeight();
    let lo = FIT_MIN, hi = FIT_MAX;
    setZoom(hi);
    if (gridFit.getBoundingClientRect().height > avail) {
      for (let i = 0; i < 9; i++) {
        const mid = (lo + hi) / 2;
        setZoom(mid);
        if (gridFit.getBoundingClientRect().height <= avail) lo = mid; else hi = mid;
      }
      setZoom(Math.floor(lo * 100) / 100);
    }
  }
  const fitBtn = document.getElementById('zoomFit');
  fitBtn.classList.toggle('on', zoomMode === 'fit');
  fitBtn.textContent = zoomMode === 'fit' ? 'Fit' : Math.round(zoomNow * 100) + '%';
  fitBtn.title = zoomMode === 'fit' ? 'Questions are fitted to the screen' : 'Back to fit the screen';
}
let zoomQueued = false;
function queueZoom() {
  if (zoomQueued) return;
  zoomQueued = true;
  requestAnimationFrame(() => { zoomQueued = false; applyZoom(); });
}
function stepZoom(d) {
  zoomManual = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round((zoomNow + d) * 10) / 10));
  zoomMode = 'manual';
  try { localStorage.setItem('bookworkZoom', zoomManual); } catch (e) {}
  applyZoom();
}

};

  pk.classes = pk.classes.filter(k => k !== c); delete pk.left[c.id]; pk.cur = pk.classes[0] ? pk.classes[0].id : null; pkSave(); pkCloseEdit();
};
$pk('pkEditBtn').onclick = () => $pk('pkEdit').hidden ? pkOpenEdit() : pkCloseEdit();
$pk('pkClass').onchange = e => { pk.cur = e.target.value; pkSave(); $pk('pkName').textContent = '—'; pkRender(); };
$pk('pkPick').onclick = () => pkPick();
$pk('pkClose').onclick = () => { pk.open = false; pkSave(); pkRender(); queueZoom(); };
$pk('pickerTab').onclick = () => { pk.open = true; pkSave(); pkRender(); queueZoom(); };

pkRender();

syncMix();
renderChips();
syncControls();
generate();
</script>

</body>
