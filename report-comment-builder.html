/* Layout: class roll rail on the left, one student worked through as numbered report sections on the right */
:root{

  --accent:#8c1d40; --accent-ink:#ffffff; --accent-wash:#f6e7ec;
  --ok:#1f6b3a; --ok-wash:#e5f2e9; --warn:#8a5a00; --warn-wash:#fbf1dc; --bad:#a11b1b; --bad-wash:#fbe5e5;
  --font:'Montserrat','Century Gothic',CenturyGothic,'Segoe UI',Arial,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17131a; --ink:#efe8eb; --muted:#a99ca2; --line:#3a3036; --wash:#211b20;
  --accent:#e2809f; --accent-ink:#1a0d13; --accent-wash:#3a1f2a;

  --ok:#7fd39b; --ok-wash:#173022; --warn:#f0c46a; --warn-wash:#352a12; --bad:#ff9b9b; --bad-wash:#3a1818; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;border-bottom:3px solid var(--accent);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-size:18px;font-weight:700}
.top .sub{color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.seg label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100% - 60px)}
.rail{border-right:1px solid var(--line);background:var(--wash);padding:14px 10px;display:flex;flex-direction:column;gap:10px}
.rail h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.roll{display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
.roll button{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:var(--r);cursor:pointer}
.roll button:hover{background:var(--paper)}
.roll button.on{background:var(--paper);box-shadow:inset 3px 0 0 var(--accent);font-weight:700}
.dots{display:flex;gap:3px}
.dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);font-size:9px;font-weight:700;display:grid;place-items:center;color:var(--muted);background:var(--paper)}
.dot.y{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.dot.na{opacity:.35}
.dot.sb{border-radius:4px}
.rail .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:0 6px}
main{padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:980px}
.stu{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;padding-bottom:14px;border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field .seg{align-self:flex-start}
.field>span,.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:7px 9px;min-width:0;max-width:100%}
input[type=text]:hover,select:hover,textarea:hover{border-color:var(--muted)}
.big{font-size:20px;font-weight:700;width:220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:6px 11px;font-weight:600;font-size:13px;border-right:1px solid var(--line);min-width:34px;text-align:center}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--ink);color:var(--paper)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 18px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.tab .n{font-size:11px;border:1px solid currentColor;border-radius:50%;width:19px;height:19px;display:grid;place-items:center}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab.done .n{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.sec{display:flex;flex-direction:column;gap:16px}
.sec h2{font-size:17px}
.hint{color:var(--muted);font-size:13px;max-width:70ch}
.q{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.q h3{font-size:14px;font-weight:700}
.q h3 small{font-weight:500;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>.field{flex:1 1 200px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.slot{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.slot:first-of-type{border-top:0;padding-top:0}
.line{font-family:var(--font);width:100%;resize:vertical;min-height:72px;background:var(--wash);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--wash);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-wash);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-wash);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-wash);color:var(--warn);border-color:transparent}
.out{border:2px solid var(--ink);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.out textarea{width:100%;min-height:190px;resize:vertical;font-size:14px;line-height:1.6}
.meter{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums;align-items:center}
.meter b{font-size:16px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.checks li{font-size:13px;padding:6px 10px;border-radius:var(--r);background:var(--wash)}
.checks li.bad{background:var(--bad-wash);color:var(--bad)}
.checks li.warn{background:var(--warn-wash);color:var(--warn)}
.checks li.ok{background:var(--ok-wash);color:var(--ok)}
select.st-bad{border-color:var(--bad);background:var(--bad-wash);color:var(--bad);font-weight:600}
select.st-warn{border-color:var(--warn);background:var(--warn-wash);color:var(--warn);font-weight:600}
.why{font-size:12.5px;font-weight:600;margin:-4px 0 0;padding-left:2px}
.why.bad{color:var(--bad)} .why.warn{color:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.preview{font-size:14px;line-height:1.75;background:var(--wash);border-radius:var(--r);padding:12px}
.preview mark{background:none;color:inherit;border-radius:3px;padding:1px 2px}
.preview mark.bad{background:var(--bad-wash);color:var(--bad);box-shadow:inset 0 -2px 0 var(--bad)}
.preview mark.warn{background:var(--warn-wash);color:var(--warn);box-shadow:inset 0 -2px 0 var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.c,th.c{text-align:center;width:44px}
td.c input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.kla{display:flex;flex-direction:column;gap:12px}
.kla-h{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.sub-h td{background:var(--wash);font-weight:700}
.copyblk{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}

.copyblk .head h3{font-size:13px}
.copyblk .head small{color:var(--muted);font-weight:500}
.copyblk pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:13.5px;background:var(--wash);padding:10px;border-radius:var(--r)}
.copyblk pre.empty{color:var(--muted);font-style:italic}
.btn.copied{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--paper);color:var(--ink);border-radius:10px;max-width:560px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.modal textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px}
.rules{font-size:13px;columns:2 280px;column-gap:24px;margin:0;padding-left:18px}
.rules li{break-inside:avoid;margin-bottom:4px}
details summary{cursor:pointer;font-weight:600}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:calc(16px + env(safe-area-inset-right,0px));background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:var(--r);font-weight:600;font-size:13px;z-index:60}
.empty-state{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.ex-tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-left:4px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line)}
  .roll{flex-direction:row;overflow-x:auto;gap:4px}
  .roll li{flex:0 0 auto}
  .roll button{width:auto}
  .rail .foot{display:none}
  .grid2{grid-template-columns:1fr}
  .big{width:100%}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const SUBJ=[

  ['PDHPE',/\b(sports?|sporting|physical|movement|athletic\w*|ball skills|PE)\b/i,s=>s.pdh.grade],

      if(v<=2 && POS_RE.test(x)) out.push({i,k:'bad',t:`Sentence ${i+1} sounds very positive about ${name}, but the ${name} grade is ${g}.`}); }
    if(ef && ef<=1.5 && EFF_POS.test(x)) out.push({i,k:'bad',t:`Sentence ${i+1} praises effort, but effort is mostly Low.`});

function slotFlags(s,text){

  ['char','prog','appr','str','dev','wb'].forEach(k=>{ if(!c[k]) out.push({k:'warn',t:'Still to answer: '+GC_CATS[k].replace(' – be specific','')}); });
  if(chars<400) out.push({k:'bad',t:`Too short by ${400-chars} characters. Add a second strength, wellbeing point or interest.`});
  if(chars>800) out.push({k:'bad',t:`Over 800 by ${chars-800} characters. Remove a 2nd choice or shorten a sentence.`});
  if(sents.length<5||sents.length>6) out.push({k:'bad',t:`${sents.length} sentences. The school asks for 5–6.`});
  const ban=[[/\bhowever\b/i,'"however"'],[/\band also\b/i,'"and also"'],[/\balways\b/i,'"always" (over-claim)'],[/\bat all times\b/i,'"at all times" (over-claim)'],[/—/,'an em dash']];

  if(sd['Works cooperatively']==='A' && picks(s,'wb').includes('Needs help to cooperate')) out.push({k:'warn',t:'Works cooperatively is rated Always, but the comment says needs help to cooperate.'});

function updateOutputs(){
  const s=st(); if(!s) return;
  document.querySelectorAll('[data-line]').forEach(el=>{ const p=el.dataset.line.split('.'); const sl=s[p[0]][p[1]][+p[2]]; if(document.activeElement!==el) el.value=slotText(sl,p[1],s);
    const ch=document.querySelector(`[data-chk="${el.dataset.line}"]`); if(ch) ch.innerHTML=lineChecks(el.value,p[1],sl).map(c=>`<span class="chip ${c.k}">${esc(c.t)}</span>`).join(''); });
  const o=$('#gc-out'); if(o){ if(document.activeElement!==o) o.value=gcText(s); const t=o.value, n=splitSent(t).length, ch=t.length;
    $('#gc-meter').innerHTML=`<span><b style="color:var(--${ch>=400&&ch<=800?'ok':'bad'})">${ch}</b> / 400–800 characters</span><span><b style="color:var(--${n>=5&&n<=6?'ok':'bad'})">${n}</b> / 5–6 sentences</span>`;
    $('#gc-checks').innerHTML=gcChecks(s).map(c=>`<li class="${c.k}">${esc(c.t)}</li>`).join('');
    const fl=[...slotFlags(s,t),...textFlags(s,t)], lvl={};
    fl.forEach(f=>{ if(f.i<0) return; if(f.k==='bad'||!lvl[f.i]) lvl[f.i]=f.k; });
    $('#gc-preview').innerHTML = t ? splitSent(t).map((x,i)=>lvl[i]?`<mark class="${lvl[i]}">${esc(x)}</mark>`:esc(x)).join(' ') : '<span style="color:var(--muted)">Nothing yet</span>';
    $('#gc-edited').textContent = s.gc.ov!=null ? 'You have edited this comment by hand. Changing answers above will not overwrite it until you press Rebuild.' : ''; }
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('done',tabDone(s,b.dataset.tab)));
  renderRoll();
}
function setPath(obj,path,val){ const p=path.split('.'); let o=obj; for(let i=0;i<p.length-1;i++){ if(p[i]==='m'||p[i]==='sd'){ o=o[p[i]]; o[p.slice(i+1).join('.')]=val; return; } o=o[p[i]]; } o[p[p.length-1]]=val; }
function onField(e){
  const el=e.target, k=el.dataset.k; if(!k) return; const s=st(); if(!s) return;
  let v=el.value;
  if(k==='maths'){ s.maths=v==='y'; save(); render(); return; }
  if(k==='entered'){ s.entered=v==='y'; save(); updateOutputs(); return; }
  if(k.endsWith('.ov')){ setPath(s,k,v); save(); updateOutputs(); return; }
  setPath(s,k,v);
  const m=k.match(/^(eng|mth)\.(s|g)\.(\d)\./); if(m) s[m[1]][m[2]][+m[3]].ov=null;
  if(k.startsWith('gc.')&&k!=='gc.notes'){ s.gc.v=null; if(el.tagName==='SELECT'){ save(); render(); return; } }
  if(k==='name'||k==='pron'||k==='year'){ s.gc.v=null; if(e.type==='change' && k!=='name') { save(); render(); return; } }
  save();
  if(e.type==='change' && el.tagName==='INPUT' && el.type==='radio' && /^(hsie|pdh)\.grade$/.test(k)){ render(); return; }
  updateOutputs();
}
document.addEventListener('input',e=>{ if(e.target.matches('input[type=text],textarea')) onField(e); });
document.addEventListener('change',e=>{ if(e.target.matches('select,input[type=radio]')) onField(e); });

/* ---------- actions ---------- */
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),1600); }
function copyText(text,btn){
  const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent='Copied'; btn.classList.add('copied'); setTimeout(()=>{btn.textContent=o;btn.classList.remove('copied')},1400);} };
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){ toast('Select the text and press Ctrl+C'); } ta.remove(); };
  try{ navigator.clipboard.writeText(text).then(done,fallback); }catch(e){ fallback(); }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const s=st();
  if(b.dataset.stu){ cur=b.dataset.stu; render(); window.scrollTo(0,0); return; }
  if(b.dataset.tab){ tab=b.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(b.dataset.copy){ const m={es:()=>block(s.eng,'s',s),eg:()=>block(s.eng,'g',s),ms:()=>block(s.mth,'s',s),mg:()=>block(s.mth,'g',s),gc:()=>gcText(s)}; const t=m[b.dataset.copy](); if(t) copyText(t,b); else toast('Nothing to copy yet'); return; }
  const a=b.dataset.act; if(!a) return;
  if(a==='class') openClass();
  if(a==='del'){ if(b.dataset.confirm){ S.students=S.students.filter(x=>x.id!==s.id); cur=S.students[0]?.id||null; save(); render(); } else { b.dataset.confirm='1'; b.textContent='Click again to remove '+(s.name||'student'); setTimeout(()=>{ if(b.isConnected){ delete b.dataset.confirm; b.textContent='Remove student'; } },3000); } }
  if(a==='fill'){ const k=s[b.dataset.b]; if(!k.grade){ toast('Choose the achievement grade first'); return; } const key=b.dataset.b==='hsie'?'HSIE':'PDH'; PDATA[key].groups.forEach(([gn,items])=>items.forEach((_,ii)=>k.m[gn+'|'+ii]=k.grade)); save(); render(); }
  if(a==='sdall'){ SD_ITEMS.forEach(i=>s.sd[i]=b.dataset.v); save(); render(); }
  if(a==='shuffle'){ s.gc.shuffle=(s.gc.shuffle||0)+1; s.gc.ov=null; s.gc.v=null; const V=slotVariants(s); const seed=hash(s.name||'x')+s.gc.shuffle*7; s.gc.v={}; ORDER.forEach((k,i)=>{ if(V[k]) s.gc.v[k]=(seed+i*13)%V[k].length; }); save(); updateOutputs(); }
  if(a==='rebuild'){ s.gc.ov=null; s.gc.v=null; save(); updateOutputs(); }
  if(a==='nextstu'){ const i=S.students.findIndex(x=>x.id===cur); const n=S.students[i+1]; if(n){ cur=n.id; tab='eng'; render(); window.scrollTo(0,0);} else toast('That was the last student'); }
  if(a==='close') $('#modal-root').innerHTML='';
  if(a==='addclass') addClass();
  if(a==='bk-copy') copyText($('#bk-text').value,b);
  if(a==='bk-dl'){ try{ const blob=new Blob([$('#bk-text').value],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='report-comments-backup.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(err){ toast('Download blocked here. Use Copy instead.'); } }
  if(a==='bk-restore'){ try{ const d=JSON.parse($('#bk-in').value); if(!Array.isArray(d.students)) throw 0; if(!b.dataset.confirm){ b.dataset.confirm='1'; b.textContent='Click again to replace all '+S.students.length+' students'; return; } S=d; cur=S.students[0]?.id||null; save(); $('#modal-root').innerHTML=''; render(); toast('Restored '+S.students.length+' students'); }catch(err){ toast('That is not a valid backup'); } }
});
$('#b-class').onclick=openClass;
$('#b-backup').onclick=openBackup;
$('#b-rules').onclick=openRules;
function modal(html){ $('#modal-root').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`; }
function openClass(){ modal(`<h2>Add students</h2><p class="hint">One student per line. Add the pronoun and year after commas. Put <b>nomaths</b> on the end for students not in your maths class.</p>
  <textarea id="cl-in" placeholder="David, he, 6&#10;Sienna, she, 5&#10;Uthman, he, 6, nomaths"></textarea>
  <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn pri" type="button" data-act="addclass">Add to class</button></div>`); setTimeout(()=>$('#cl-in').focus(),20); }
function addClass(){ const lines=$('#cl-in').value.split(/\n/).map(x=>x.trim()).filter(Boolean); let n=0;
  lines.forEach(l=>{ const p=l.split(/[,\t]/).map(x=>x.trim()); const name=p[0]; if(!name) return; const low=p.slice(1).map(x=>x.toLowerCase());
    const pron=low.find(x=>['he','she','they','m','f','male','female'].includes(x)); const pr=!pron?'he':pron==='m'||pron==='male'?'he':pron==='f'||pron==='female'?'she':pron;
    const yr=low.find(x=>/^(year\s*)?[56]$/.test(x)); const s=newStudent(name,pr,yr?yr.slice(-1):'6'); if(low.includes('nomaths')) s.maths=false; S.students.push(s); n++; });
  if(n){ cur=S.students[S.students.length-n].id; tab='eng'; } save(); $('#modal-root').innerHTML=''; render(); toast(`Added ${n} student${n===1?'':'s'}`); }
function openBackup(){ modal(`<h2>Back up / restore</h2><p class="hint">Your class saves automatically in this browser. Keep a backup in case the browser is cleared, or to move to another computer.</p>
  <label class="field"><span>Backup of ${S.students.length} students</span><textarea id="bk-text" readonly>${esc(JSON.stringify(S))}</textarea></label>
  <div class="row"><button class="btn pri" type="button" data-act="bk-copy">Copy backup</button><button class="btn" type="button" data-act="bk-dl">Download file</button></div>
  <label class="field"><span>Restore · paste a backup or choose a file</span><textarea id="bk-in" placeholder='{"students":[...]}'></textarea></label>
  <div class="row"><input type="file" id="bk-file" accept=".json,application/json"><button class="btn danger" type="button" data-act="bk-restore">Restore</button><button class="btn" type="button" data-act="close" style="margin-left:auto">Close</button></div>`);
  $('#bk-file').onchange=ev=>{ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $('#bk-in').value=r.result; }; r.readAsText(f); }; }
function openRules(){ modal(`<h2>Rules this tool follows</h2>
  <details open><summary>Strengths and goals (English, Maths)</summary><ul class="rules">
  <li>Two strengths and two goals, each on its own line</li><li>Each line starts with "* "</li><li>Lowercase start and no full stop</li><li>Each line contains a conjunction</li><li>Goals start with "to"</li><li>Present tense</li><li>Give an example where possible</li><li>No textbooks or competitions such as UNSW or Olympiad</li><li>SchoolBytes writes the "Name's strengths in English include:" lead-in</li></ul></details>
  <details open><summary>General Comment</summary><ul class="rules">
  <li>400–800 characters and 5–6 sentences</li><li>Positive introduction, overall progress, a can-do strength, a clear area for development, wellbeing, then an interest or closing</li><li>Openings alternate the name and the pronoun</li><li>No "however", no "and also", no "always" or "at all times"</li><li>Areas for development name the actual skill or behaviour</li><li>No contradictions with the Social Development ratings</li><li>Plain, parent-friendly Australian English</li><li>Wording is chosen so no two students in the class share the same sentences</li></ul></details>
  <div class="row" style="justify-content:flex-end"><button class="btn pri" type="button" data-act="close">Close</button></div>`); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#modal-root').innerHTML=''; });

load(); render();
</script>
